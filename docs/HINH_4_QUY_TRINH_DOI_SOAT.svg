<svg id="reconciliation-process-diagram" viewBox="0 0 1000 655" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Soft Shadows -->
    <filter id="soft-shadow" x="-2%" y="-3%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.06"/>
    </filter>
    <filter id="header-shadow" x="-1%" y="-3%" width="102%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- 0. TIÊU ĐỀ QUY TRÌNH (HEADER BANNER)                          -->
  <!-- ============================================================ -->
  <rect x="25" y="12" width="950" height="44" rx="7" fill="#0f172a" filter="url(#header-shadow)"/>
  <text x="500" y="31" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle" letter-spacing="0.3">HÌNH 4: QUY TRÌNH ĐỐI SOÁT DÒNG TIỀN KHÉP KÍN TẠI QUẦY THU NGÂN</text>
  <text x="500" y="47" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Vòng đời 6 giai đoạn: Từ mở ca, xuất VietQR động, đối soát 3 tầng đến chốt ca Merkle Root</text>

  <!-- ============================================================ -->
  <!-- 1. HÀNG 1: QUẦY THU NGÂN POS & KHÁCH HÀNG (GĐ 1, GĐ 2, GĐ 3)  -->
  <!-- ============================================================ -->

  <!-- Card 1: Giai Đoạn 1 - Mở Ca Bán Hàng (x=25 to 305) -->
  <g transform="translate(25, 66)">
    <rect width="280" height="124" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1" filter="url(#soft-shadow)"/>
    <rect width="280" height="20" rx="6" fill="#e0f2fe"/>
    <path d="M 0 14 L 0 20 L 280 20 L 280 14 Z" fill="#e0f2fe"/>
    <text x="140" y="14" fill="#0369a1" font-size="9.8" font-weight="700" text-anchor="middle">1. MỞ CA BÁN HÀNG (CHỦ QUÁN / QUẢN LÝ)</text>
    <text x="12" y="35" fill="#1e293b" font-size="8.8">• Đăng nhập hệ thống, cấu hình tên ca bán hàng</text>
    <text x="12" y="50" fill="#1e293b" font-size="8.8">• Thiết lập doanh thu mục tiêu: target_revenue KPI</text>
    <text x="12" y="65" fill="#1e293b" font-size="8.8">• Ca chuyển trạng thái OPEN, kích hoạt quầy POS</text>
    <text x="12" y="80" fill="#1e293b" font-size="8.8">• Khởi tạo phiên kiểm toán ca trên Microsoft SQL Server</text>
    <rect x="12" y="94" width="256" height="16" rx="3" fill="#f0f9ff"/>
    <text x="140" y="105.5" fill="#0284c7" font-size="8" font-weight="600" text-anchor="middle">Khóa cứng: Tuyệt đối cấm tạo đơn khi chưa mở ca</text>
  </g>

  <!-- Mũi tên GĐ 1 -> GĐ 2 (x=305 đến 360, tâm y=128) -->
  <line x1="305" y1="128" x2="360" y2="128" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="360,128 351,124 351,132" fill="#2563eb"/>
  <rect x="312" y="112" width="41" height="14" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="332" y="122.5" fill="#1d4ed8" font-size="7.5" font-weight="700" text-anchor="middle">Ca OPEN</text>

  <!-- Card 2: Giai Đoạn 2 - Lập Đơn & Xuất VietQR Động (x=360 to 640) -->
  <g transform="translate(360, 66)">
    <rect width="280" height="124" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1" filter="url(#soft-shadow)"/>
    <rect width="280" height="20" rx="6" fill="#dcfce7"/>
    <path d="M 0 14 L 0 20 L 280 20 L 280 14 Z" fill="#dcfce7"/>
    <text x="140" y="14" fill="#15803d" font-size="9.8" font-weight="700" text-anchor="middle">2. LẬP ĐƠN &amp; XUẤT VIETQR ĐỘNG (POS)</text>
    <text x="12" y="35" fill="#1e293b" font-size="8.8">• Nhân viên tạo đơn hàng mới, trạng thái UNPAID</text>
    <text x="12" y="50" fill="#1e293b" font-size="8.8">• Hệ thống khóa cứng số tiền đơn và mã hóa đơn</text>
    <text x="12" y="65" fill="#1e293b" font-size="8.8">• Sinh mã VietQR động chuẩn NAPAS: ACTIVE</text>
    <text x="12" y="80" fill="#1e293b" font-size="8.8">• Hiển thị trực quan lên màn hình phụ hướng về khách</text>
    <rect x="12" y="94" width="256" height="16" rx="3" fill="#f0fdf4"/>
    <text x="140" y="105.5" fill="#166534" font-size="8" font-weight="600" text-anchor="middle">Chống Fake Bill: Khóa cứng giá trị, không thể sửa tiền</text>
  </g>

  <!-- Mũi tên GĐ 2 -> GĐ 3 (x=640 đến 695, tâm y=128) -->
  <line x1="640" y1="128" x2="695" y2="128" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="695,128 686,124 686,132" fill="#2563eb"/>
  <rect x="646" y="112" width="43" height="14" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="667" y="122.5" fill="#1d4ed8" font-size="7.5" font-weight="700" text-anchor="middle">Quét QR</text>

  <!-- Card 3: Giai Đoạn 3 - Thanh Toán & Webhook (x=695 to 975) -->
  <g transform="translate(695, 66)">
    <rect width="280" height="124" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1" filter="url(#soft-shadow)"/>
    <rect width="280" height="20" rx="6" fill="#faf5ff"/>
    <path d="M 0 14 L 0 20 L 280 20 L 280 14 Z" fill="#faf5ff"/>
    <text x="140" y="14" fill="#6b21a8" font-size="9.8" font-weight="700" text-anchor="middle">3. THANH TOÁN &amp; BẮN WEBHOOK (NGÂN HÀNG)</text>
    <text x="12" y="35" fill="#1e293b" font-size="8.8">• Khách hàng dùng app ngân hàng quét VietQR</text>
    <text x="12" y="50" fill="#1e293b" font-size="8.8">• Chuyển tiền thành công vào tài khoản chủ quán</text>
    <text x="12" y="65" fill="#1e293b" font-size="8.8">• Cổng ngân hàng ghi nhận biến động số dư tức thì</text>
    <text x="12" y="80" fill="#1e293b" font-size="8.8">• Bắn bản tin Webhook HTTP POST về máy chủ Backend</text>
    <rect x="12" y="94" width="256" height="16" rx="3" fill="#fdf4ff"/>
    <text x="140" y="105.5" fill="#7e22ce" font-size="8" font-weight="600" text-anchor="middle">Chữ ký số HMAC-SHA256 &amp; Timestamp chống Replay</text>
  </g>

  <!-- Mũi tên GĐ 3 -> GĐ 4 đi XUỐNG (x=835, từ y=190 đến 226) -->
  <line x1="835" y1="190" x2="835" y2="226" stroke="#7e22ce" stroke-width="2"/>
  <polygon points="835,226 831,217 839,217" fill="#7e22ce"/>
  <!-- Nhãn đính kèm mũi tên Webhook (không dùng ký tự mũi tên trong chữ) -->
  <rect x="844" y="200" width="126" height="18" rx="3" fill="#faf5ff" stroke="#d8b4fe" stroke-width="0.9"/>
  <text x="907" y="212.5" fill="#6b21a8" font-size="7.8" font-weight="700" text-anchor="middle">Webhook (HMAC-SHA256)</text>

  <!-- Mũi tên Vòng lặp Nhánh 4B đi LÊN GĐ 2 (x=500, từ y=226 lên y=190) -->
  <line x1="500" y1="226" x2="500" y2="190" stroke="#d97706" stroke-width="2"/>
  <polygon points="500,190 496,199 504,199" fill="#d97706"/>
  <!-- Nhãn đính kèm vòng lặp (không dùng ký tự mũi tên gây nhầm hướng) -->
  <rect x="508" y="200" width="170" height="18" rx="3" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.9"/>
  <text x="593" y="212.5" fill="#b45309" font-size="7.8" font-weight="700" text-anchor="middle">Cấp VietQR mới thu phần thiếu</text>

  <!-- ============================================================ -->
  <!-- 2. HÀNG 2: GIAI ĐOẠN 4 - ĐỘNG CƠ ĐỐI SOÁT TỰ ĐỘNG & RẼ NHÁNH -->
  <!-- ============================================================ -->
  <rect x="25" y="226" width="950" height="206" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3" filter="url(#soft-shadow)"/>
  
  <!-- Header Bar Giai Đoạn 4 (Đã sửa lỗi đè chữ, khoảng cách 160px an toàn) -->
  <path d="M 25 234 Q 25 226 33 226 L 967 226 Q 975 226 975 234 L 975 250 L 25 250 Z" fill="#dcfce7"/>
  <text x="40" y="242" fill="#14532d" font-size="10.5" font-weight="700">GIAI ĐOẠN 4: ĐỘNG CƠ ĐỐI SOÁT TỰ ĐỘNG &amp; RẼ NHÁNH XỬ LÝ (FASTAPI)</text>
  <text x="960" y="241" fill="#166534" font-size="8.5" font-weight="600" text-anchor="end">HMAC-SHA256 • Chống Replay dt ≤ 300s • Động cơ AI 3 tầng (Regex, RapidFuzz C++, Subset-Sum)</text>
  <line x1="25" y1="250" x2="975" y2="250" stroke="#86efac" stroke-width="1"/>

  <!-- Sub-Card 4C (Bên trái): Nhánh Sai Nội Dung / Tiền Treo (x=40 to 338, Center=189) -->
  <g transform="translate(40, 258)">
    <rect width="298" height="162" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1.1" filter="url(#soft-shadow)"/>
    <rect width="298" height="20" rx="5" fill="#fee2e2"/>
    <path d="M 0 14 L 0 20 L 298 20 L 298 14 Z" fill="#fee2e2"/>
    <text x="149" y="14" fill="#b91c1c" font-size="9.5" font-weight="700" text-anchor="middle">NHÁNH 3: SAI NỘI DUNG / CHƯA RÕ ĐƠN</text>
    <text x="12" y="35" fill="#1e293b" font-size="8.8">• Khách gõ sai mã đơn, hoặc chuyển gộp nhiều đơn</text>
    <text x="12" y="50" fill="#1e293b" font-size="8.8">• Giao dịch đưa vào hàng đợi: UNMATCHED</text>
    <text x="12" y="65" fill="#1e293b" font-size="8.8">• Khoản tiền tạm ghi nhận ở trạng thái Tiền Treo ca</text>
    <text x="12" y="80" fill="#1e293b" font-size="8.8">• Kích hoạt cảnh báo thời gian thực đến Kế toán viên</text>
    <text x="12" y="95" fill="#1e293b" font-size="8.8">• Trợ lý AI Copilot phân tích ngữ cảnh gợi ý đơn</text>
    <rect x="12" y="134" width="274" height="18" rx="3" fill="#fef2f2"/>
    <text x="149" y="146.5" fill="#991b1b" font-size="8.2" font-weight="700" text-anchor="middle">Chuyển tiếp sang Giai đoạn 5 (Kế toán xử lý)</text>
  </g>

  <!-- Sub-Card 4B (Ở giữa): Nhánh Chuyển Thiếu Tiền (x=351 to 649, Center=500) -->
  <g transform="translate(351, 258)">
    <rect width="298" height="162" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="1.1" filter="url(#soft-shadow)"/>
    <rect width="298" height="20" rx="5" fill="#fef3c7"/>
    <path d="M 0 14 L 0 20 L 298 20 L 298 14 Z" fill="#fef3c7"/>
    <text x="149" y="14" fill="#b45309" font-size="9.5" font-weight="700" text-anchor="middle">NHÁNH 2: KHÁCH CHUYỂN THIẾU TIỀN</text>
    <text x="12" y="35" fill="#1e293b" font-size="8.8">• Khớp mã đơn nhưng số tiền chuyển nhỏ hơn bill</text>
    <text x="12" y="50" fill="#1e293b" font-size="8.8">• Đơn chuyển trạng thái: PARTIALLY_PAID</text>
    <text x="12" y="65" fill="#1e293b" font-size="8.8">• Thu hồi yêu cầu thanh toán cũ: REVOKED</text>
    <text x="12" y="80" fill="#1e293b" font-size="8.8">• Tự động tính số tiền thiếu: remaining_amount</text>
    <text x="12" y="95" fill="#1e293b" font-size="8.8">• Cấp VietQR mới khóa đúng tiền thiếu về quầy POS</text>
    <rect x="12" y="134" width="274" height="18" rx="3" fill="#fffbeb"/>
    <text x="149" y="146.5" fill="#92400e" font-size="8.2" font-weight="700" text-anchor="middle">Vòng lặp thu thiếu: Lũy kế đủ tiền ➔ PAID</text>
  </g>

  <!-- Sub-Card 4A (Bên phải): Nhánh Khớp Đúng 100% (x=662 to 960, Center=811) -->
  <g transform="translate(662, 258)">
    <rect width="298" height="162" rx="5" fill="#ffffff" stroke="#86efac" stroke-width="1.1" filter="url(#soft-shadow)"/>
    <rect width="298" height="20" rx="5" fill="#dcfce7"/>
    <path d="M 0 14 L 0 20 L 298 20 L 298 14 Z" fill="#dcfce7"/>
    <text x="149" y="14" fill="#15803d" font-size="9.5" font-weight="700" text-anchor="middle">NHÁNH 1: KHỚP ĐÚNG / KHỚP MỜ AN TOÀN</text>
    <text x="12" y="35" fill="#1e293b" font-size="8.8">• Đối soát thành công, tự động gạch nợ hóa đơn</text>
    <text x="12" y="50" fill="#1e293b" font-size="8.8">• Trạng thái hóa đơn: orders chuyển PAID</text>
    <text x="12" y="65" fill="#1e293b" font-size="8.8">• Đẩy Server-Sent Events (SSE) về POS &lt; 100ms</text>
    <text x="12" y="80" fill="#1e293b" font-size="8.8">• Loa Web Speech đọc to số tiền, in bill giao hàng</text>
    <text x="12" y="95" fill="#1e293b" font-size="8.8">• Ghi ngay Sổ cái chuỗi băm SHA-256 (Append-Only)</text>
    <rect x="12" y="134" width="274" height="18" rx="3" fill="#f0fdf4"/>
    <text x="149" y="146.5" fill="#166534" font-size="8.2" font-weight="700" text-anchor="middle">Ghi nhận Sổ cái SHA-256 &amp; Chuyển sang GĐ 6</text>
  </g>

  <!-- Mũi tên Sub-Card 4C đi XUỐNG GĐ 5 (x=189, từ y=432 đến 474) -->
  <line x1="189" y1="432" x2="189" y2="474" stroke="#dc2626" stroke-width="2"/>
  <polygon points="189,474 185,465 193,465" fill="#dc2626"/>
  <!-- Nhãn đính kèm đường đi xuống GĐ 5 (không có ký tự mũi tên thừa) -->
  <rect x="198" y="446" width="160" height="18" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="278" y="458.5" fill="#b91c1c" font-size="7.8" font-weight="700" text-anchor="middle">Chuyển ngoại lệ (UNMATCHED)</text>

  <!-- Mũi tên Sub-Card 4A đi XUỐNG GĐ 6 (x=811, từ y=432 đến 474) -->
  <line x1="811" y1="432" x2="811" y2="474" stroke="#059669" stroke-width="2"/>
  <polygon points="811,474 807,465 815,465" fill="#059669"/>
  <!-- Nhãn đính kèm đường đi xuống GĐ 6 (không có ký tự mũi tên thừa) -->
  <rect x="820" y="446" width="145" height="18" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="0.9"/>
  <text x="892.5" y="458.5" fill="#15803d" font-size="7.8" font-weight="700" text-anchor="middle">Khớp đúng (orders: PAID)</text>

  <!-- ============================================================ -->
  <!-- 3. HÀNG 3: GIAI ĐOẠN 5 & GIAI ĐOẠN 6 (XỬ LÝ NGOẠI LỆ & CHỐT CA) -->
  <!-- ============================================================ -->

  <!-- Card 5: Giai Đoạn 5 - Xử Lý Ngoại Lệ & Ký Sinh Trắc Học (x=25 to 470, rộng 445px) -->
  <g transform="translate(25, 474)">
    <rect width="445" height="122" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.1" filter="url(#soft-shadow)"/>
    <rect width="445" height="20" rx="6" fill="#fef3c7"/>
    <path d="M 0 14 L 0 20 L 445 20 L 445 14 Z" fill="#fef3c7"/>
    <text x="222" y="14" fill="#b45309" font-size="9.8" font-weight="700" text-anchor="middle">5. XỬ LÝ ĐỐI SOÁT NGOẠI LỆ &amp; KÝ DUYỆT FIDO2 WEBAUTHN (KẾ TOÁN)</text>
    <text x="14" y="35" fill="#1e293b" font-size="8.8">• Kế toán tra cứu giao dịch treo, sai nội dung trên màn hình reconciliation.html</text>
    <text x="14" y="50" fill="#1e293b" font-size="8.8">• Trợ lý AI Copilot phân tích dữ liệu, gợi ý ghép đơn tự động theo ngữ cảnh</text>
    <text x="14" y="65" fill="#1e293b" font-size="8.8">• Kế toán thao tác ghép đơn thủ công, bắt buộc nhập lý do giải trình nghiệp vụ</text>
    <text x="14" y="80" fill="#1e293b" font-size="8.8">• Bắt buộc Ký số sinh trắc học vân tay / khuôn mặt WebAuthn/FIDO2 (ECDSA P-256)</text>
    <rect x="14" y="93" width="417" height="17" rx="3" fill="#fffbeb"/>
    <text x="222" y="105" fill="#92400e" font-size="8.2" font-weight="700" text-anchor="middle">Lưu bảng decisions • Ghi Sổ cái chuỗi băm SHA-256 • Chống chối bỏ pháp lý 100%</text>
  </g>

  <!-- Mũi tên GĐ 5 -> GĐ 6 (x=470 đến 530, tâm y=535) -->
  <line x1="470" y1="535" x2="530" y2="535" stroke="#059669" stroke-width="2"/>
  <polygon points="530,535 521,531 521,539" fill="#059669"/>
  <rect x="477" y="520" width="46" height="15" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
  <text x="500" y="530.5" fill="#15803d" font-size="7.5" font-weight="700" text-anchor="middle">Đã duyệt</text>

  <!-- Card 6: Giai Đoạn 6 - Kiểm Toán Sổ Cái & Chốt Ca Merkle (x=530 to 975, rộng 445px) -->
  <g transform="translate(530, 474)">
    <rect width="445" height="122" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.1" filter="url(#soft-shadow)"/>
    <rect width="445" height="20" rx="6" fill="#dbeafe"/>
    <path d="M 0 14 L 0 20 L 445 20 L 445 14 Z" fill="#dbeafe"/>
    <text x="222" y="14" fill="#1e40af" font-size="9.8" font-weight="700" text-anchor="middle">6. KIỂM TOÁN SỔ CÁI &amp; NIÊM PHONG CA MERKLE ROOT (CHỦ QUÁN)</text>
    <text x="14" y="35" fill="#1e293b" font-size="8.8">• Quản lý mở Dashboard đối chiếu 4 chỉ tiêu tài chính cân đối quỹ ca bán hàng</text>
    <text x="14" y="50" fill="#1e293b" font-size="8.8">• Thuật toán quét kiểm tra tính toàn vẹn của chuỗi băm Sổ cái SHA-256 (prev_hash)</text>
    <text x="14" y="65" fill="#1e293b" font-size="8.8">• Dựng Cây Merkle, tính giá trị Merkle Root niêm phong vào bảng shift_audits</text>
    <text x="14" y="80" fill="#1e293b" font-size="8.8">• Ca bán hàng chuyển sang trạng thái CLOSED, khóa cứng quyền ghi sửa dữ liệu</text>
    <rect x="14" y="93" width="417" height="17" rx="3" fill="#eff6ff"/>
    <text x="222" y="105" fill="#1e3a8a" font-size="8.2" font-weight="700" text-anchor="middle">Bất biến mật mã học • Bằng chứng kiểm toán minh bạch • Xuất biên bản ca</text>
  </g>

  <!-- ============================================================ -->
  <!-- 4. BANNER TỔNG KẾT LUỒNG VẬN HÀNH (FOOTER SUMMARY)           -->
  <!-- ============================================================ -->
  <rect x="25" y="606" width="950" height="34" rx="6" fill="#0f172a"/>
  <text x="500" y="627" fill="#38bdf8" font-size="9.2" font-weight="700" text-anchor="middle">QUY TẮC CỐT LÕI: Sổ cái chỉ ghi thêm (Append-Only) • Đảo sổ bằng bút toán REVERSAL • Xác thực sinh trắc học FIDO2 chống chối bỏ</text>
</svg>