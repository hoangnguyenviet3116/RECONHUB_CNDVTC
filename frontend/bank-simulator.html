<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Thanh Toán Ngân Hàng — VietQR ReconHub</title>

    <!-- Google Fonts: Be Vietnam Pro & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <!-- Thanh điều hướng ứng dụng -->
    <div id="app-navbar"></div>

    <main class="py-4">
        <div class="container">
            <div class="row g-4 align-items-start">

                <!-- ===============================================================
                     CỘT TRÁI (5/12): MÀN HÌNH ỨNG DỤNG CHUYỂN KHOẢN NGÂN HÀNG
                     =============================================================== -->
                <div class="col-12 col-lg-5" data-gsap="card">
                    <div class="phone-banking-card">
                        <div class="phone-banking-header">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="badge bg-white text-primary rounded-pill">NAPAS 247 • VietQR</span>
                                <span class="small text-white-50">Xác thực HMAC tự động</span>
                            </div>
                            <h1 class="h5 fw-bold text-white mb-0">Chuyển Khoản Thanh Toán QR</h1>
                        </div>

                        <div class="p-4">
                            <form id="mock-bank-form" novalidate>
                                <!-- 1. Chọn hóa đơn cần thanh toán -->
                                <div class="mb-3">
                                    <label for="sim-order-select" class="form-label small fw-semibold">Chọn hóa đơn đang chờ thanh toán</label>
                                    <select id="sim-order-select" class="form-select">
                                        <option value="">-- Tự nhập thông tin chuyển khoản --</option>
                                    </select>
                                </div>

                                <!-- 2. Chọn nhanh tình huống chuyển khoản -->
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold d-block mb-1">Điền nhanh tình huống chuyển tiền</label>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <button type="button" class="scenario-choice-btn active" data-scenario="TC02_EXACT">
                                                <div class="fw-bold text-success small">✓ Đúng &amp; đủ tiền</div>
                                                <div class="text-secondary" style="font-size: 0.72rem;">Khớp đơn tự động</div>
                                            </button>
                                        </div>
                                        <div class="col-6">
                                            <button type="button" class="scenario-choice-btn" data-scenario="TC03_PARTIAL">
                                                <div class="fw-bold text-warning small">⚠ Chuyển thiếu tiền</div>
                                                <div class="text-secondary" style="font-size: 0.72rem;">Trả trước 1 phần</div>
                                            </button>
                                        </div>
                                        <div class="col-6">
                                            <button type="button" class="scenario-choice-btn" data-scenario="TC04_OVERPAID">
                                                <div class="fw-bold text-primary small">＋ Chuyển dư tiền</div>
                                                <div class="text-secondary" style="font-size: 0.72rem;">Tách riêng tiền thừa</div>
                                            </button>
                                        </div>
                                        <div class="col-6">
                                            <button type="button" class="scenario-choice-btn" data-scenario="TC05_WRONG_CODE">
                                                <div class="fw-bold text-danger small">✕ Sai nội dung</div>
                                                <div class="text-secondary" style="font-size: 0.72rem;">Quên ghi mã đơn</div>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <!-- 3. Số tiền chuyển khoản -->
                                <div class="mb-3">
                                    <label for="sim-amount" class="form-label small fw-semibold">Số tiền chuyển khoản (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" id="sim-amount" class="form-control form-control-lg fw-bold font-numeric text-primary" required min="1000" step="1000" value="15000000">
                                </div>

                                <!-- 4. Nội dung chuyển khoản -->
                                <div class="mb-3">
                                    <label for="sim-transfer-content" class="form-label small fw-semibold">Nội dung chuyển khoản <span class="text-danger">*</span></label>
                                    <input type="text" id="sim-transfer-content" class="form-control fw-semibold" required value="TT ORD1003">
                                </div>

                                <!-- 5. Mã giao dịch & Tùy chọn nâng cao -->
                                <div class="row g-2 mb-3">
                                    <div class="col-7">
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <label for="sim-reference-code" class="form-label small text-secondary mb-0">Mã giao dịch</label>
                                            <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none" id="btn-gen-ref-code" style="font-size: 0.72rem;">
                                                ↻ Đổi mã
                                            </button>
                                        </div>
                                        <input type="text" id="sim-reference-code" class="form-control form-control-sm font-numeric" required value="FT2629488101">
                                    </div>
                                    <div class="col-5">
                                        <label for="sim-test-mode" class="form-label small text-secondary mb-1">Chế độ gửi</label>
                                        <select id="sim-test-mode" class="form-select form-select-sm">
                                            <option value="STANDARD">Hợp lệ chuẩn</option>
                                            <option value="INVALID_HMAC">Sai chữ ký số</option>
                                            <option value="CONCURRENT_DUPLICATE">Gửi trùng 2 lần</option>
                                            <option value="REPLAY_ATTACK">Tấn công phát lại (Replay Attack)</option>
                                        </select>
                                    </div>
                                </div>

                                <div id="sim-form-error" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

                                <button type="submit" class="btn-fp-success w-100 py-3" id="btn-trigger-transfer">
                                    <span>Xác nhận chuyển khoản</span>
                                    <svg class="hi-icon hi-icon-sm" viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- ===============================================================
                     CỘT PHẢI (7/12): BIÊN LAI KẾT QUẢ & LỊCH SỬ TIỀN VÀO
                     =============================================================== -->
                <div class="col-12 col-lg-7 d-flex flex-column gap-3" data-gsap="card">

                    <!-- Khối 1: Biên lai kết quả giao dịch vừa thực hiện -->
                    <section class="recon-workspace-card">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <h2 class="h6 fw-bold mb-0">Kết Quả Xử Lý Giao Dịch</h2>
                            <span class="fp-badge fp-badge-neutral" id="inspector-http-status">Sẵn sàng</span>
                        </div>

                        <div id="inspector-friendly-box" class="p-3 rounded-3 bg-light border small text-secondary">
                            Chọn hóa đơn bên trái và bấm <strong>Xác nhận chuyển khoản</strong> để thực hiện thanh toán.
                        </div>
                    </section>

                    <!-- Khối 2: Bảng lịch sử biến động số dư -->
                    <section class="recon-workspace-card">
                        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 pb-2 mb-3 border-bottom">
                            <h2 class="h5 fw-bold mb-0">Biến Động Số Dư Ngân Hàng</h2>
                            <button type="button" class="btn-fp-outline py-1 px-2" id="btn-refresh-bank-tx" title="Làm mới">
                                ↻ Làm mới
                            </button>
                        </div>

                        <div class="table-responsive">
                            <table class="fp-table">
                                <thead>
                                    <tr>
                                        <th>Mã GD</th>
                                        <th>Nội dung</th>
                                        <th class="text-end">Số tiền nhận</th>
                                        <th class="text-end">Đã khớp / Còn dư</th>
                                        <th>Trạng thái</th>
                                    </tr>
                                </thead>
                                <tbody id="sim-bank-tx-tbody">
                                    <tr>
                                        <td colspan="5" class="text-center py-4 text-secondary">
                                            Đang tải lịch sử giao dịch...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>

                </div>

            </div>
        </div>
    </main>

    <div id="app-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/tts_speaker.js"></script>
    <script src="js/bank_simulator.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderNavbar("simulator");
            renderFooter();
            initPageAnimations();
            initBankSimulatorPage();
        });
    </script>
</body>
</html>
